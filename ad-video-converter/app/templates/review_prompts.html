<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프롬프트 검토</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #f0f0f0; padding: 40px 24px; }
    .header { max-width: 800px; margin: 0 auto 32px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    p.sub { color: #888; font-size: 14px; }
    .cards { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card { background: #1a1a1a; border-radius: 10px; overflow: hidden; display: flex; gap: 0; }
    .card img { width: 160px; min-width: 160px; aspect-ratio: 16/9; object-fit: cover; }
    .card-body { flex: 1; padding: 16px; }
    .card-body .label { font-size: 12px; color: #666; margin-bottom: 8px; }
    .card-body textarea {
      width: 100%; background: #111; border: 1px solid #333; border-radius: 6px;
      padding: 10px; color: #f0f0f0; font-size: 13px; line-height: 1.5; resize: vertical; min-height: 80px; font-family: inherit;
    }
    .footer { max-width: 800px; margin: 32px auto 0; display: flex; gap: 16px; }
    button {
      padding: 12px 28px; background: #6366f1; color: white; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #5254cc; }
    .notice { max-width: 800px; margin: 0 auto 24px; background: #1e1e2e; border: 1px solid #3b3b6b; border-radius: 8px; padding: 14px 16px; font-size: 13px; color: #a0a0cc; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Step 3 — 프롬프트 검토</h1>
    <p class="sub">각 클립의 프롬프트를 확인하고 수정한 뒤 제출하세요.</p>
  </div>

  <div class="notice">
    💡 Higgsfield video-to-video에 전달될 프롬프트입니다. 제품 묘사나 유지하고 싶은 요소를 직접 수정할 수 있습니다.
  </div>

  <div class="cards" id="cards">
    {% for clip in job.clips %}
    <div class="card">
      <img src="/uploads/clips/{{ job.job_id }}/{{ clip.thumb_filename }}" alt="clip">
      <div class="card-body">
        <div class="label">클립 #{{ loop.index }} · {{ "%.1f"|format(clip.start) }}s – {{ "%.1f"|format(clip.end) }}s</div>
        <textarea data-index="{{ clip.index }}" id="prompt_{{ clip.index }}">{{ clip.prompt }}</textarea>
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="footer">
    <button onclick="saveAndNext()">확정 후 다음 단계 →</button>
  </div>

  <script>
    const jobId = "{{ job.job_id }}";

    async function saveAndNext() {
      const textareas = document.querySelectorAll('textarea[data-index]');
      const prompts = {};
      textareas.forEach(ta => { prompts[ta.dataset.index] = ta.value.trim(); });

      const res = await fetch(`/api/job/${jobId}/update-prompts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(prompts),
      });

      if (res.ok) {
        window.location.href = `/job/${jobId}/result`;
      }
    }
  </script>
</body>
</html>
