<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Video Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 560px; padding: 40px 32px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p.sub { color: #888; font-size: 14px; margin-bottom: 36px; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 8px; }
    input[type="file"], textarea {
      width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
      padding: 12px; color: #f0f0f0; font-size: 14px;
    }
    textarea { resize: vertical; min-height: 80px; font-family: inherit; }
    input[type="file"]::file-selector-button {
      background: #333; color: #f0f0f0; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 10px;
    }
    button[type="submit"] {
      width: 100%; padding: 14px; background: #6366f1; color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    button[type="submit"]:hover { background: #5254cc; }
    button[type="submit"]:disabled { background: #444; cursor: not-allowed; }
    .status { margin-top: 20px; text-align: center; font-size: 14px; color: #888; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ad Video Converter</h1>
    <p class="sub">레퍼런스 광고 영상에서 제품만 교체합니다</p>

    <form id="uploadForm">
      <div class="field">
        <label>레퍼런스 광고 영상</label>
        <input type="file" id="referenceVideo" accept="video/*" required>
      </div>
      <div class="field">
        <label>우리 제품 이미지</label>
        <input type="file" id="productImage" accept="image/*" required>
      </div>
      <div class="field">
        <label>제품 설명 (프롬프트 생성에 사용됩니다)</label>
        <textarea id="productDesc" placeholder="예: 민트색 스킨케어 세럼 병, 흰색 미니멀 패키징, 30ml" required></textarea>
      </div>
      <button type="submit" id="submitBtn">장면 분석 시작</button>
    </form>
    <div class="status" id="status">영상을 분석하는 중입니다...</div>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = '업로드 중...';
      status.style.display = 'block';

      const form = new FormData();
      form.append('reference_video', document.getElementById('referenceVideo').files[0]);
      form.append('product_image', document.getElementById('productImage').files[0]);
      form.append('product_description', document.getElementById('productDesc').value);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '업로드 실패');
        window.location.href = `/job/${data.job_id}/clips`;
      } catch (err) {
        status.textContent = '오류: ' + err.message;
        btn.disabled = false;
        btn.textContent = '장면 분석 시작';
      }
    });
  </script>
</body>
</html>
