<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Video Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 560px; padding: 40px 32px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p.sub { color: #888; font-size: 14px; margin-bottom: 32px; }
    .mode-select { display: flex; gap: 12px; margin-bottom: 32px; }
    .mode-btn {
      flex: 1; padding: 16px 12px; border-radius: 10px; border: 2px solid #333;
      background: #1a1a1a; color: #aaa; cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .mode-btn.active { border-color: #6366f1; background: #1e1e3a; color: #fff; }
    .mode-btn .icon { font-size: 22px; margin-bottom: 6px; }
    .mode-btn .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .mode-btn .desc { font-size: 12px; color: #666; }
    .mode-btn.active .desc { color: #a0a0cc; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 8px; }
    label .opt { color: #555; font-size: 12px; margin-left: 6px; }
    input[type="file"], textarea {
      width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
      padding: 12px; color: #f0f0f0; font-size: 14px;
    }
    textarea { resize: vertical; min-height: 80px; font-family: inherit; }
    input[type="file"]::file-selector-button {
      background: #333; color: #f0f0f0; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 10px;
    }
    .section-divider { border: none; border-top: 1px solid #222; margin: 8px 0 20px; }
    .section-title { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    button[type="submit"] {
      width: 100%; padding: 14px; background: #6366f1; color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    button[type="submit"]:hover { background: #5254cc; }
    button[type="submit"]:disabled { background: #444; cursor: not-allowed; }
    .status { margin-top: 20px; text-align: center; font-size: 14px; color: #888; display: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ad Video Converter</h1>
    <p class="sub">레퍼런스 광고 영상을 분석하고 맞춤 프롬프트를 생성합니다</p>

    <div class="mode-select">
      <div class="mode-btn active" id="modeProduct" onclick="setMode('product')">
        <div class="icon">📦</div>
        <div class="title">제품 홍보</div>
        <div class="desc">레퍼런스 영상의 제품을<br>내 제품으로 교체</div>
      </div>
      <div class="mode-btn" id="modeService" onclick="setMode('service')">
        <div class="icon">📱</div>
        <div class="title">서비스 홍보</div>
        <div class="desc">레퍼런스 영상 스타일로<br>내 서비스 홍보</div>
      </div>
    </div>

    <form id="uploadForm">
      <input type="hidden" id="modeInput" name="mode" value="product">

      <div class="field">
        <label>레퍼런스 광고 영상</label>
        <input type="file" id="referenceVideo" accept="video/*" required>
      </div>

      <div class="field" id="productImageField">
        <label>우리 제품 이미지</label>
        <input type="file" id="productImage" accept="image/*">
      </div>

      <div class="field" id="descField">
        <label id="descLabel">제품 설명 <span class="opt">(프롬프트 생성에 사용됩니다)</span></label>
        <textarea id="productDesc" placeholder="예: 민트색 스킨케어 세럼 병, 흰색 미니멀 패키징, 30ml" required></textarea>
      </div>

      <hr class="section-divider">
      <p class="section-title">인물 / 배경 교체 <span style="color:#444">(선택)</span></p>

      <div class="two-col">
        <div class="field">
          <label>인물 이미지 <span class="opt">선택</span></label>
          <input type="file" id="characterImage" accept="image/*">
        </div>
        <div class="field">
          <label>배경 이미지 <span class="opt">선택</span></label>
          <input type="file" id="backgroundImage" accept="image/*">
        </div>
      </div>

      <button type="submit" id="submitBtn">장면 분석 시작</button>
    </form>
    <div class="status" id="status">영상을 분석하는 중입니다...</div>
  </div>

  <script>
    let currentMode = 'product';

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeInput').value = mode;
      document.getElementById('modeProduct').classList.toggle('active', mode === 'product');
      document.getElementById('modeService').classList.toggle('active', mode === 'service');

      const imageField = document.getElementById('productImageField');
      const descLabel = document.getElementById('descLabel');
      const descTA = document.getElementById('productDesc');

      if (mode === 'product') {
        imageField.classList.remove('hidden');
        document.getElementById('productImage').required = true;
        descLabel.innerHTML = '제품 설명 <span class="opt">(프롬프트 생성에 사용됩니다)</span>';
        descTA.placeholder = '예: 민트색 스킨케어 세럼 병, 흰색 미니멀 패키징, 30ml';
      } else {
        imageField.classList.add('hidden');
        document.getElementById('productImage').required = false;
        descLabel.innerHTML = '서비스 설명 <span class="opt">(어떤 서비스인지 자세히 설명해주세요)</span>';
        descTA.placeholder = '예: 운동 루틴을 AI가 자동으로 만들어주는 피트니스 앱, 초보자도 쉽게 사용 가능';
      }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = '업로드 중...';
      status.style.display = 'block';

      const form = new FormData();
      form.append('reference_video', document.getElementById('referenceVideo').files[0]);
      form.append('product_description', document.getElementById('productDesc').value);
      form.append('mode', currentMode);

      if (currentMode === 'product') {
        const imgFile = document.getElementById('productImage').files[0];
        if (imgFile) form.append('product_image', imgFile);
      }

      const charFile = document.getElementById('characterImage').files[0];
      if (charFile) form.append('character_image', charFile);

      const bgFile = document.getElementById('backgroundImage').files[0];
      if (bgFile) form.append('background_image', bgFile);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '업로드 실패');
        window.location.href = `/job/${data.job_id}/clips`;
      } catch (err) {
        status.textContent = '오류: ' + err.message;
        btn.disabled = false;
        btn.textContent = '장면 분석 시작';
      }
    });
  </script>
</body>
</html>
