<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결과</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #f0f0f0; padding: 40px 24px; }
    .header { max-width: 800px; margin: 0 auto 32px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    p.sub { color: #888; font-size: 14px; }
    .notice { max-width: 800px; margin: 0 auto 28px; border-radius: 8px; padding: 14px 16px; font-size: 13px; }
    .notice.ready { background: #1a2a1a; border: 1px solid #3b6b3b; color: #90cc90; }
    .cards { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #1a1a1a; border-radius: 10px; padding: 16px 20px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .card-header .label { font-size: 13px; color: #888; }
    .card-header .time { font-size: 12px; color: #555; }
    .prompt-text { font-size: 13px; color: #ccc; background: #111; border-radius: 6px; padding: 10px 12px; line-height: 1.5; margin-bottom: 12px; }
    .card-footer { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 12px; cursor: pointer; text-decoration: none; border: none; }
    .btn-gray { background: #2a2a2a; color: #aaa; border: 1px solid #444; }
    .btn-purple { background: #444; color: white; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Step 4 — 클립 & 프롬프트 확인</h1>
    <p class="sub">클립을 다운로드하고 프롬프트를 복사해서 Higgsfield에 업로드하세요.</p>
  </div>

  <div class="notice ready">
    ✅ 프롬프트 확정 완료. 각 클립을 다운로드하고 Higgsfield에서 생성하세요.
  </div>

  <div class="cards">
    {% for clip in job.clips %}
    <div class="card">
      <div class="card-header">
        <span class="label">클립 #{{ loop.index }}</span>
        <span class="time">{{ "%.1f"|format(clip.start) }}s – {{ "%.1f"|format(clip.end) }}s</span>
      </div>
      <div class="prompt-text">{{ clip.prompt }}</div>
      <div class="card-footer">
        <a class="btn btn-gray" href="/uploads/clips/{{ job.job_id }}/{{ clip.clip_filename }}" download>클립 다운로드</a>
        <button class="btn btn-purple" onclick="copyPrompt(this, `{{ clip.prompt | replace('`', '') }}`)">프롬프트 복사</button>
      </div>
    </div>
    {% endfor %}
  </div>

  <script>
    function copyPrompt(btn, text) {
      navigator.clipboard.writeText(text);
      btn.textContent = '복사됨!';
      setTimeout(() => btn.textContent = '프롬프트 복사', 1500);
    }
  </script>
</body>
</html>
